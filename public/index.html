<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0d2537"><title>AppFactory</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head><body><main><header><p class="eyebrow">APPFACTORY / STARTER</p><h1>Mit arbejdsbord</h1><p>En lokal, offline-klar app. Dine opgaver gemmes på enheden.</p></header><section aria-label="Opgaver"><div class="stats"><div><span>Åbne</span><strong id="open">0</strong></div><div><span>Afsluttede</span><strong id="done">0</strong></div></div><form id="form"><label for="title">Ny opgave</label><div class="line"><input id="title" required maxlength="200" autocomplete="off" placeholder="Hvad skal du huske?"><button id="submit">Tilføj</button></div><button type="button" id="cancel" class="secondary" hidden>Annuller redigering</button></form><label for="search">Find opgaver</label><input id="search" type="search" placeholder="Søg…"><label for="sort">Sortér</label><select id="sort"><option value="room-asc">Værelsesnummer, laveste først</option><option value="room-desc">Værelsesnummer, højeste først</option><option value="newest">Nyeste oprettet først</option><option value="oldest">Ældste oprettet først</option></select><p id="status" role="status" aria-live="polite"></p><ul id="items"></ul></section><section aria-label="Backup"><h2>Backup</h2><p>Eksportér dine opgaver før du rydder browserdata eller skifter telefon.</p><div class="line"><button id="export" class="secondary">Eksportér JSON</button><button id="import" class="secondary">Importér JSON</button></div><input type="file" id="file" accept=".json,application/json" hidden></section></main><script type="module" src="app.mjs"></script></body></html>
